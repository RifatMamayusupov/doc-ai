<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748B"/>
    </marker>
    <marker id="arrI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#6366F1"/>
    </marker>
  </defs>
  <rect width="1200" height="640" rx="20" fill="#F8FAFC"/>
  <text x="40" y="52" font-size="22" font-weight="800" fill="#0F172A">System architecture</text>
  <text x="40" y="78" font-size="14" fill="#64748B">One FastAPI process hosts the REST API, the WebSocket stream and the deepagents runtime.</text>

  <!-- Frontend column -->
  <rect x="40" y="110" width="300" height="490" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="40" y="110" width="300" height="44" rx="16" fill="#EEF2FF"/>
  <rect x="40" y="138" width="300" height="16" fill="#EEF2FF"/>
  <text x="60" y="139" font-size="15" font-weight="700" fill="#4338CA">Frontend · React 19 + Vite</text>
  <g font-size="13" fill="#334155">
    <rect x="60" y="174" width="260" height="46" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="76" y="195" font-weight="700">ChatPanel · HITLModal</text>
    <text x="76" y="211" fill="#64748B" font-size="12">prompts, slash commands, approvals</text>
    <rect x="60" y="230" width="260" height="46" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="76" y="251" font-weight="700">PipelineCanvas</text>
    <text x="76" y="267" fill="#64748B" font-size="12">live tool graph (React Flow)</text>
    <rect x="60" y="286" width="260" height="46" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="76" y="307" font-weight="700">PreviewPanel · DataPreview</text>
    <text x="76" y="323" fill="#64748B" font-size="12">xlsx / docx / pdf / image preview</text>
    <rect x="60" y="342" width="260" height="46" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="76" y="363" font-weight="700">Industry · Deadline panels</text>
    <text x="76" y="379" fill="#64748B" font-size="12">domain modules, due-date alerts</text>
    <rect x="60" y="398" width="260" height="46" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="76" y="419" font-weight="700">LogsPanel</text>
    <text x="76" y="435" fill="#64748B" font-size="12">real-time agent events</text>
  </g>
  <rect x="60" y="468" width="260" height="112" rx="10" fill="#EEF2FF" stroke="#C7D2FE"/>
  <text x="76" y="492" font-size="12" font-weight="700" fill="#4338CA" letter-spacing="1">STATE &amp; TRANSPORT</text>
  <text x="76" y="516" font-size="13" fill="#334155">Zustand store</text>
  <text x="76" y="538" font-size="13" fill="#334155">useWebSocket hook</text>
  <text x="76" y="560" font-size="13" fill="#334155">AuthContext (JWT)</text>

  <!-- arrows FE -> BE -->
  <line x1="344" y1="250" x2="436" y2="250" stroke="#6366F1" stroke-width="2" marker-end="url(#arrI)" marker-start="url(#arrI)"/>
  <text x="390" y="240" font-size="12" font-weight="700" fill="#4338CA" text-anchor="middle">WebSocket</text>
  <text x="390" y="270" font-size="11" fill="#64748B" text-anchor="middle">/ws/{client}</text>
  <line x1="344" y1="360" x2="436" y2="360" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>
  <text x="390" y="350" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">REST</text>
  <text x="390" y="380" font-size="11" fill="#64748B" text-anchor="middle">/api/*</text>

  <!-- Backend -->
  <rect x="440" y="110" width="420" height="490" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="440" y="110" width="420" height="44" rx="16" fill="#ECFEFF"/>
  <rect x="440" y="138" width="420" height="16" fill="#ECFEFF"/>
  <text x="460" y="139" font-size="15" font-weight="700" fill="#0F766E">Backend · FastAPI (main.py)</text>

  <g font-size="12">
    <rect x="460" y="172" width="120" height="40" rx="8" fill="#F0FDFA" stroke="#99F6E4"/>
    <text x="520" y="197" text-anchor="middle" font-weight="700" fill="#0F766E">auth.py · JWT</text>
    <rect x="590" y="172" width="120" height="40" rx="8" fill="#F0FDFA" stroke="#99F6E4"/>
    <text x="650" y="197" text-anchor="middle" font-weight="700" fill="#0F766E">sessions.py</text>
    <rect x="720" y="172" width="120" height="40" rx="8" fill="#F0FDFA" stroke="#99F6E4"/>
    <text x="780" y="197" text-anchor="middle" font-weight="700" fill="#0F766E">admin routers</text>
  </g>

  <!-- agent engine -->
  <rect x="460" y="228" width="380" height="150" rx="12" fill="#EEF2FF" stroke="#818CF8" stroke-width="1.5"/>
  <text x="480" y="254" font-size="14" font-weight="800" fill="#3730A3">agent_engine.py</text>
  <text x="480" y="274" font-size="12" fill="#4F46E5">deepagents · LangGraph · InMemory checkpointer</text>
  <g font-size="11.5" font-weight="600" fill="#3730A3">
    <rect x="480" y="290" width="108" height="30" rx="6" fill="#FFFFFF" stroke="#C7D2FE"/>
    <text x="534" y="309" text-anchor="middle">Filesystem MW</text>
    <rect x="596" y="290" width="108" height="30" rx="6" fill="#FFFFFF" stroke="#C7D2FE"/>
    <text x="650" y="309" text-anchor="middle">Memory MW</text>
    <rect x="712" y="290" width="108" height="30" rx="6" fill="#FFFFFF" stroke="#C7D2FE"/>
    <text x="766" y="309" text-anchor="middle">Skills MW</text>
    <rect x="480" y="328" width="108" height="30" rx="6" fill="#FFFFFF" stroke="#C7D2FE"/>
    <text x="534" y="347" text-anchor="middle">Shell MW</text>
    <rect x="596" y="328" width="224" height="30" rx="6" fill="#FEF3C7" stroke="#FCD34D"/>
    <text x="708" y="347" text-anchor="middle" fill="#92400E">Human-in-the-loop interrupts</text>
  </g>

  <!-- tools and services -->
  <rect x="460" y="394" width="185" height="186" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="476" y="418" font-size="12" font-weight="700" fill="#0F172A" letter-spacing="1">TOOLS (tools.py)</text>
  <g font-size="12" fill="#334155">
    <text x="476" y="442">ocr_extract · parse_excel</text>
    <text x="476" y="462">clean_data · redact_pii</text>
    <text x="476" y="482">fill_template</text>
    <text x="476" y="502">batch_generate</text>
    <text x="476" y="522">compare_documents</text>
    <text x="476" y="542">check_compliance</text>
    <text x="476" y="562">execute_code · translate</text>
  </g>
  <rect x="655" y="394" width="185" height="186" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="671" y="418" font-size="12" font-weight="700" fill="#0F172A" letter-spacing="1">SERVICES</text>
  <g font-size="12" fill="#334155">
    <text x="671" y="442">industry_modules</text>
    <text x="671" y="462">workflow_engine</text>
    <text x="671" y="482">template_engine</text>
    <text x="671" y="502">preview_service</text>
    <text x="671" y="522">deadline_tracker</text>
    <text x="671" y="542">code_executor</text>
    <text x="671" y="562">telegram_bot</text>
  </g>

  <!-- arrows BE -> external -->
  <line x1="864" y1="250" x2="936" y2="200" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="864" y1="320" x2="936" y2="320" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="864" y1="500" x2="936" y2="450" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="864" y1="540" x2="936" y2="560" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>

  <!-- External -->
  <g font-size="13">
    <rect x="940" y="140" width="220" height="110" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="960" y="166" font-size="12" font-weight="700" fill="#7C3AED" letter-spacing="1">LLM PROVIDERS</text>
    <text x="960" y="192" fill="#334155" font-weight="600">Google Gemini (default)</text>
    <text x="960" y="214" fill="#334155">Anthropic Claude</text>
    <text x="960" y="236" fill="#334155">OpenAI</text>

    <rect x="940" y="270" width="220" height="100" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="960" y="296" font-size="12" font-weight="700" fill="#0369A1" letter-spacing="1">WEB</text>
    <text x="960" y="322" fill="#334155">Tavily search</text>
    <text x="960" y="344" fill="#334155">fetch_url · http_request</text>

    <rect x="940" y="390" width="220" height="100" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="960" y="416" font-size="12" font-weight="700" fill="#B45309" letter-spacing="1">STORAGE</text>
    <text x="960" y="442" fill="#334155">SQLite · data/monister.db</text>
    <text x="960" y="464" fill="#334155">uploads/ · data/ · templates/</text>

    <rect x="940" y="510" width="220" height="90" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="960" y="536" font-size="12" font-weight="700" fill="#0284C7" letter-spacing="1">DELIVERY</text>
    <text x="960" y="562" fill="#334155">Telegram Bot API</text>
    <text x="960" y="584" fill="#64748B" font-size="12">send finished documents</text>
  </g>
</svg>
